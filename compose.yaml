name: cashmovements

x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04

services:
  db:
    image: *sql-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}
    ports:
      - "127.0.0.1:${CASHMOVEMENTS_SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 3 -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24

  db-init:
    image: *sql-image
    profiles: [setup]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}
    volumes:
      - ./db:/setup:ro
    working_dir: /setup
    entrypoint: ["/bin/sh", "/setup/init.sh"]
    command: ["setup"]

volumes:
  sql-data:
